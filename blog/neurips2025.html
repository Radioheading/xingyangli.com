<html>
<head>

    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments)};

    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="chrome=1">
    <title>NeurIPS 游记 - Xingyang Li</title>

    <link rel="icon" type="image/png" href="../images/ACMClass.png">
    <link rel="stylesheet" href="../stylesheets/blog.css">

    <!-- KaTeX CSS for math rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">

    <!-- Highlight.js CSS for syntax highlighting -->

<body class="blog-page">
    <div class="post-container">
        <!-- Navigation -->
        <div class="blog-nav">
            <a href="index.html">← Back to Blog</a>
            <span style="margin: 0 10px;">|</span>
            <a href="../index.html">← Back to Homepage</a>
        </div>

        <!-- Post Header (dynamically populated) -->
        <div class="post-header" id="post-header">
            <!-- Header content will be inserted by JavaScript -->
        </div>

        <!-- Table of Contents (dynamically generated) -->
        <div id="toc">
            <!-- TOC will be inserted by JavaScript -->
        </div>

        <!-- Post Content (dynamically rendered from Markdown) -->
        <article class="post-content" id="post-content">
            <!-- Content will be inserted by JavaScript -->
        </article>
    </div>

    <!-- JavaScript Libraries -->
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>

    <!-- KaTeX for math rendering -->
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <!-- Highlight.js for syntax highlighting -->
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/es/highlight.min.js"></script>

    <!-- Blog Renderer -->
    <script src="../javascripts/blog-renderer.js"></script>

    <!-- Initialize Blog Post -->
    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            const renderer = new BlogRenderer();
            await renderer.renderBlogPost('neurips2025', 'source/neurips2025.md');
        });
    </script>
</body>
