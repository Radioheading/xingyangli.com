<body class="blog-page">
    <div class="blog-container">
        <!-- Navigation -->
        <div class="blog-nav">
            <a href="../index.html">← Back to Homepage</a>
        </div>

        <!-- Header -->
        <div class="blog-header">
            <h1>Blog</h1>
            <p class="tagline">Thoughts on research and life</p>
        </div>

        <!-- Blog Posts Grid -->
        <div class="blog-grid" id="blog-posts">
            <!-- Blog posts will be dynamically loaded here -->
        </div>
    </div>

    <!-- Blog Metadata and Rendering Script -->
    <script>
        // Blog posts metadata - Add new posts here
        const blogPosts = [
            // TBD: Blog posts coming soon
            // Add more blog posts here in the future
        ];

        // Calculate reading time from word count
        function calculateReadingTime(text) {
            // Count English words
            const englishWords = text.match(/[a-zA-Z]+/g) || [];
            // Count Chinese characters
            const chineseChars = text.match(/[\u4e00-\u9fa5]/g) || [];

            // Average reading speed: 200 English words/min, 300 Chinese chars/min
            const englishTime = englishWords.length / 200;
            const chineseTime = chineseChars.length / 300;

            const totalMinutes = Math.ceil(englishTime + chineseTime);
            return totalMinutes;
        }

        // Fetch markdown file and calculate reading time
        async function getReadingTime(filename) {
            try {
                const response = await fetch(filename);
                const text = await response.text();
                return calculateReadingTime(text);
            } catch (error) {
                console.error('Error fetching file:', error);
                return 5; // Default fallback
            }
        }

        // Format date
        function formatDate(dateString) {
            const date = new Date(dateString);
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            return date.toLocaleDateString('en-US', options);
        }

        // Render blog posts
        async function renderBlogPosts() {
            const container = document.getElementById('blog-posts');

            // Check if there are any posts
            if (blogPosts.length === 0) {
                container.innerHTML = '<div style="text-align: center; padding: 60px 20px; color: #666; font-size: 18px;">📝 Blog posts coming soon (TBD)</div>';
                return;
            }

            // Sort posts by date (newest first)
            const sortedPosts = blogPosts.sort((a, b) => new Date(b.date) - new Date(a.date));

            for (const post of sortedPosts) {
                // Calculate reading time
                const readingTime = await getReadingTime(post.file);

                // Create card element
                const card = document.createElement('a');
                card.className = 'blog-card';
                card.href = `${post.id}.html`;

                // Build card HTML
                card.innerHTML = `
                    <div class="date">${formatDate(post.date)}</div>
                    <div class="title">${post.title}</div>
                    <div class="excerpt">${post.excerpt}</div>
                    <div class="metadata">
                        <span class="read-time">📖 ${readingTime} min read</span>
                        <div class="tags">
                            ${post.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                        </div>
                    </div>
                    <div class="read-more">Read full article →</div>
                `;

                container.appendChild(card);
            }
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', renderBlogPosts);
    </script>
</body>
</html>
